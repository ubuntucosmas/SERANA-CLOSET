; Serana Closet queue worker: sends receipts, WhatsApp-order emails and owner
; alerts. Copy to /etc/supervisor/conf.d/, set the path and user, then:
;   sudo supervisorctl reread && sudo supervisorctl update
; deploy.sh runs `php artisan queue:restart` so workers pick up new code.
[program:serana-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/serana/artisan queue:work --tries=3 --backoff=30 --max-time=3600 --sleep=3
directory=/var/www/serana
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=90
redirect_stderr=true
stdout_logfile=/var/www/serana/storage/logs/worker.log
